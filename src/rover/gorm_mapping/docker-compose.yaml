services:
  aruco-deploy:
    build:
      context: ..
      dockerfile: gorm_mapping/Dockerfile
      target: aruco
    container_name: rover-aruco
    volumes:
      - ../gorm_mapping:/home/workspace/src/gorm_mapping
      - /dev/:/dev/
      - /usr/local/zed/resources/:/usr/local/zed/resources/
      - /dev/shm:/dev/shm
    working_dir: /home/workspace
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=50
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    network_mode: host
    privileged: true
    restart: unless-stopped
    devices:
      - /dev:/dev
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    entrypoint: ["/bin/bash"]

    # command: ["-c", "source /opt/ros/humble/setup.bash && source /home/workspace/install/setup.bash && ros2 launch gorm_mapping aruco_alignment.launch.py"]
